<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>مكتبة الكتب</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            text-align: center;
            margin: 50px;
        }
        form {
            margin-bottom: 30px;
        }
        input[type="text"] {
            padding: 10px;
            width: 250px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #008CBA;
            color: white;
            border: none;
            cursor: pointer;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            background: white;
            margin: 10px auto;
            padding: 10px;
            width: 300px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <h1>📚 مكتبة الكتب</h1>

    <form method="POST">
        <input type="text" name="title" placeholder="اكتب اسم الكتاب" required>
        <button type="submit">إضافة</button>
    </form>

    <h2>قائمة الكتب:</h2>
    <ul>
        {% for book in books %}
          <li>
            {{ book.title }}
            <form action="/delete/{{ book.id }}" method="POST" style="display:inline;">
              <button type="submit">❌ حذف</button>
            </form>
          </li>
        {% endfor %}
      </ul>
      

</body>
</html>
